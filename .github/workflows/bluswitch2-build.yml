name: BluSwitch 2 Native Android
on:
  push:
    branches:
      - bluswitch2-native-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free runner storage and install shader tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends glslang-tools ninja-build python3 pkg-config ccache
          glslangValidator --version
      - name: Install Android SDK, NDK and CMake using runner SDK
        run: |
          echo "SDK: $ANDROID_SDK_ROOT"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.31.5' 'platform-tools'
      - name: Fetch GPL-licensed Switch 2 Android engine
        run: |
          git clone --recursive --depth 1 --branch nx2-android-v0.3.0 https://git.eden-emu.dev/moceure/eden-nx2-android.git nx2-source
          test -f nx2-source/src/android/app/build.gradle.kts
      - name: Apply standalone BluSwitch 2 branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('nx2-source/src/android/app')
          gradle = root / 'build.gradle.kts'
          g = gradle.read_text()
          g, n = re.subn(r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"', lambda m:m.group(1)+'"uk.co.blustudio.bluswitch2"',g,count=1)
          assert n == 1, "Upstream Gradle app ID layout changed"
          g = re.sub(r'(appNameBase"\s+to\s+)"Eden(?: [^"]*)?"', lambda m:m.group(1)+'"BluSwitch 2"',g)
          g = g.replace('"Eden$suffix"','"BluSwitch 2$suffix"')
          gradle.write_text(g)
          strings = root / 'src/main/res/values/strings.xml'
          s = strings.read_text()
          s, n = re.subn(r'(<string\s+name="app_name"[^>]*>)(.*?)(</string>)',lambda m:m.group(1)+'BluSwitch 2'+m.group(3),s,count=1,flags=re.S)
          assert n == 1, "Upstream strings layout changed"
          ET.fromstring(s)
          strings.write_text(s)
          manifest = root / 'src/main/AndroidManifest.xml'
          m = manifest.read_text()
          assert 'android:icon="@mipmap/ic_launcher"' in m
          m = m.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/bluswitch_icon"',1)
          m = m.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/bluswitch_icon"',1)
          manifest.write_text(m)
          drawable = root / 'src/main/res/drawable'
          drawable.mkdir(parents=True,exist_ok=True)
          (drawable/'bluswitch_icon.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#09245C" android:pathData="M54,0 A54,54 0,1 1,54 108 A54,54 0,1 1,54 0"/>
              <path android:fillColor="#1CD1FF" android:pathData="M31,24 L56,24 C72,24 81,32 79,43 C77,52 65,57 51,61 L30,69 L30,57 L53,48 C63,44 67,42 67,38 C67,33 61,33 54,33 L31,33 Z"/>
              <path android:fillColor="#387BFF" android:pathData="M76,46 C86,58 78,73 60,79 L29,88 L29,76 L56,68 C67,64 71,59 67,55 Z"/>
          </vector>''')
          print('Applied BluSwitch 2 package, name and icon; upstream emulator and licences preserved')
          PY
      - name: Build ARM64 native Android APK
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          cd nx2-source/src/android
          chmod +x gradlew
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon --no-parallel --max-workers=2 -PYUZU_ANDROID_ARGS="-DGLSLANGVALIDATOR=$(command -v glslangValidator)" :app:assembleMainlineDebug 2>&1 | tee "$GITHUB_WORKSPACE/compile.log"
      - name: Confirm APK contains native emulator libraries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil,hashlib
          paths=list(Path('nx2-source/src/android/app/build/outputs/apk').rglob('*.apk'))
          assert len(paths)>=1,'No APK produced'
          p=next((p for p in paths if 'mainline' in p.name.lower() or 'mainline' in str(p).lower()),paths[0])
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert 'AndroidManifest.xml' in names
              assert any(n.startswith('classes') and n.endswith('.dex') for n in names)
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('.so') for n in names), 'No ARM64 native libraries in APK'
          dest=Path('BluSwitch2-Experimental-Android.apk')
          shutil.copy2(p,dest)
          Path('BluSwitch2-Experimental-Android.apk.sha256').write_text(hashlib.sha256(dest.read_bytes()).hexdigest()+'  '+dest.name+'\n')
          print('Verified native ARM64 libraries in '+str(dest))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BluSwitch2-Experimental-Android
          path: |
            BluSwitch2-Experimental-Android.apk
            BluSwitch2-Experimental-Android.apk.sha256
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: BluSwitch2-Compiler-Log
          path: compile.log
          if-no-files-found: ignore
